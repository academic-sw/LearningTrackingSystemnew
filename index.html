<script>
/* =========================================================
   CONFIG & GAS INTEGRATION
   ========================================================= */
const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbw2T62Ggl8mtJgel25FSHYH0bkeaf1kx-pcBHqWLOiRmFHFahJVOECrYryrUuiYgAzD4A/exec"; 

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hexToRgb(h){h=(h||'#16a34a').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(hex,p){const [r,g,b]=hexToRgb(hex);return rgbToHex(r*(100+p)/100,g*(100+p)/100,b*(100+p)/100);}
function lighten(hex,p){const [r,g,b]=hexToRgb(hex);return rgbToHex(r+(255-r)*p/100,g+(255-g)*p/100,b+(255-b)*p/100);}

function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' เวลา '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
function fmtD(s){if(!s)return '-';const d=new Date(s);if(isNaN(d))return '-';return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
const semLabel = s => s ? `ภาคเรียนที่ ${s.term}/${s.year}` : '-';

const Toast = Swal.mixin({toast:true,position:'top-end',showConfirmButton:false,timer:2200,timerProgressBar:true,
  didOpen:t=>{t.addEventListener('mouseenter',Swal.stopTimer);t.addEventListener('mouseleave',Swal.resumeTimer);}});
const toast = (msg,icon='success') => Toast.fire({icon,title:msg});
const alertCfg = () => ({confirmButtonColor: DB?.settings?.primary || '#16a34a'});

function showLoader(txt = 'กำลังโหลด...'){ 
  $('#loaderText').textContent = txt;
  $('#loader').classList.remove('hidden'); 
}
function hideLoader(){ $('#loader').classList.add('hidden'); }

function readFiles(input, cb){
  const files = Array.from(input.files || []);
  if(!files.length) return cb([]);
  const out = []; let done = 0;
  files.forEach(f=>{
    const fr = new FileReader();
    fr.onload = () => { out.push({name:f.name, type:f.type, data:fr.result}); if(++done === files.length) cb(out); };
    fr.onerror = () => { if(++done === files.length) cb(out); };
    fr.readAsDataURL(f);
  });
}

/* =========================================================
   1. DATABASE (localStorage + GOOGLE SHEETS & DRIVE SYNC)
   ========================================================= */
const LS_DB='swm_db_v1', LS_SESSION='swm_session', LS_REMEMBER='swm_remember', LS_GAS='swm_gas_url';
let DB, session = null, route = 'home', chartInst = null;
let homePage = 1, searchPage = 1, recPage = 1, teacherStatsPage = 1, userPage = 1, subjectPage = 1, semPage = 1, adminNewsPage = 1;
const LS_DIRTY='swm_dirty', LS_SYNCED='swm_synced';
let syncChain = Promise.resolve();

function getGasUrl(){
  return localStorage.getItem(LS_GAS) || DEFAULT_GAS_URL;
}

function defaultDB(){
  const sid = uid();
  return {
    settings:{ logo:'', primary:'#16a34a', accent:'#facc15', currentSemesterId: sid, gasUrl:'' },
    news:[],
    users:[{id:uid(), username:'admin', password:'admin1234', fullname:'ผู้ดูแลระบบ', role:'admin', position:''}],
    semesters:[{id:sid, term:'1', year:'2568'}],
    levels:['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'],
    subjects:[],
    records:[]
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_DB);
    DB = raw ? JSON.parse(raw) : defaultDB();
  }catch(e){ DB = defaultDB(); }
  const d = defaultDB();
  Object.keys(d).forEach(k => { if(DB[k] === undefined) DB[k] = d[k]; });
  if(!DB.settings.currentSemesterId && DB.semesters[0]) DB.settings.currentSemesterId = DB.semesters[0].id;
  if(!DB.settings.gasUrl) DB.settings.gasUrl = getGasUrl();
  saveDBLocal();
}

function saveDBLocal(){
  try{ localStorage.setItem(LS_DB, JSON.stringify(DB)); }
  catch(e){ Swal.fire({icon:'error',title:'พื้นที่จัดเก็บไม่เพียงพอ',text:'กรุณาลบไฟล์แนบหรือรูปภาพบางส่วนออก',...alertCfg()}); }
}

function buildSyncPayload(){
  return JSON.stringify({action:'syncAll', data: DB}, (k, v) =>
    (typeof v === 'string' && v.startsWith('data:') && v.length > 40000) ? '' : v);
}

async function pushToGAS(){
  const gasUrl = getGasUrl();
  if(!gasUrl) return false;
  const res = await fetch(gasUrl, { method:'POST', body: buildSyncPayload() });
  const json = await res.json();
  if(json.status !== 'success') throw new Error(json.message || 'sync failed');
  localStorage.removeItem(LS_DIRTY);
  localStorage.setItem(LS_SYNCED, '1');
  return true;
}

function saveDB(syncToGas = true){
  saveDBLocal();
  if(!syncToGas || !getGasUrl()) return Promise.resolve(true);
  localStorage.setItem(LS_DIRTY, '1');
  syncChain = syncChain
    .then(pushToGAS)
    .then(() => true)
    .catch(err => {
      console.error('GAS sync error:', err);
      Swal.fire({icon:'warning', title:'บันทึกลง Google Sheet ไม่สำเร็จ',
        text:'ข้อมูลถูกเก็บในเครื่องแล้ว จะลองซิงค์ใหม่ในครั้งถัดไป (' + err.message + ')', ...alertCfg()});
      return false;
    });
  return syncChain;
}

async function fetchFromGAS(manual = false){
  const gasUrl = getGasUrl();
  if(!gasUrl){
    if(manual) Swal.fire({icon:'info', title:'ยังไม่ได้เชื่อมต่อ Google Sheet', text:'กรุณาใส่ Web App URL ในเมนู "ตั้งค่าระบบ"', ...alertCfg()});
    return;
  }
  if(manual) showLoader('กำลังซิงค์ข้อมูลกับ Google Sheet...');
  try {
    const hasLocal = DB.records.length || DB.news.length || DB.subjects.length;
    const needPush = localStorage.getItem(LS_DIRTY) === '1' ||
                     (!localStorage.getItem(LS_SYNCED) && hasLocal);
    if(needPush){
      await pushToGAS();
      if(manual) toast('ส่งข้อมูลในเครื่องขึ้น Google Sheet สำเร็จ');
      return;
    }

    const res = await fetch(`${gasUrl}?action=getAll`);
    const json = await res.json();
    if(json && json.status === 'success' && json.data){
      const d = json.data;
      if(d.settings && Object.keys(d.settings).length) DB.settings = Object.assign(DB.settings, d.settings);
      if(d.semesters && d.semesters.length) DB.semesters = d.semesters;
      if(d.levels && d.levels.length) DB.levels = d.levels;
      if(d.subjects) DB.subjects = d.subjects;
      if(d.users && d.users.length) DB.users = d.users;
      if(d.records) DB.records = d.records;
      if(d.news) DB.news = d.news;
      localStorage.setItem(LS_SYNCED, '1');
      saveDBLocal();
      applyTheme();
      refreshChrome();
      refresh();
      if(manual) toast('ดึงข้อมูลจาก Google Sheet สำเร็จ');
    } else if(manual){
      Swal.fire({icon:'error', title:'Apps Script ตอบกลับผิดพลาด', text: (json && json.message) || 'ไม่ทราบสาเหตุ', ...alertCfg()});
    }
  } catch(e) {
    console.warn('Error fetching from GAS:', e);
    if(manual) Swal.fire({icon:'error', title:'เชื่อมต่อไม่สำเร็จ',
      text:'ตรวจสอบ URL และตั้งสิทธิ์ Deploy เป็น "Anyone" (' + e.message + ')', ...alertCfg()});
  } finally {
    if(manual) hideLoader();
  }
}

async function uploadFileToDrive(base64Data, fileName, mimeType){
  const gasUrl = getGasUrl();
  if(!gasUrl) return base64Data;
  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      body: JSON.stringify({ action:'uploadFile', base64Data, fileName, mimeType })
    });
    const json = await res.json();
    if(json && json.status === 'success' && json.fileUrl) return json.fileUrl;
    throw new Error((json && json.message) || 'upload failed');
  } catch(e) {
    console.warn('Upload to Drive failed, fallback to base64:', e);
    toast('อัปโหลดขึ้น Drive ไม่สำเร็จ (' + e.message + ')', 'warning');
    return base64Data;
  }
}

function applyTheme(){
  const s = DB.settings;
  const p = s.primary || '#16a34a';
  document.documentElement.style.setProperty('--c-primary', p);
  document.documentElement.style.setProperty('--c-primary-dark', shade(p,-18));
  document.documentElement.style.setProperty('--c-accent', s.accent || '#facc15');
  document.documentElement.style.setProperty('--c-soft', lighten(p,86));
}

function formatImgUrl(url){
  if(!url) return '';
  url = String(url).trim();
  if(url.startsWith('data:') || url.startsWith('blob:')) return url;
  const m = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m && m[1]){
    return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  }
  return url;
}

function handleImgError(el){
  const original = el.getAttribute('src') || '';
  const m = original.match(/id=([a-zA-Z0-9_-]+)/) || original.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m && m[1] && !el.dataset.fallback){
    el.dataset.fallback = '1';
    el.src = `https://lh3.googleusercontent.com/d/${m[1]}=w1200`;
    return;
  }
  const sizeCls = Array.from(el.classList).filter(c => c.startsWith('w-') || c.startsWith('h-') || c.startsWith('text-')).join(' ') || 'w-11 h-11 text-xl';
  el.outerHTML = `<div class="${sizeCls} flex items-center justify-center rounded-xl shrink-0" style="background:var(--c-soft);color:var(--c-primary)"><i class="fa-solid fa-graduation-cap"></i></div>`;
}

function handleNewsImgError(el){
  const original = el.getAttribute('src') || '';
  const m = original.match(/id=([a-zA-Z0-9_-]+)/) || original.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m && m[1] && !el.dataset.fallback){
    el.dataset.fallback = '1';
    el.src = `https://lh3.googleusercontent.com/d/${m[1]}=w1200`;
    return;
  }
  el.outerHTML = `<div class="w-full h-28 flex flex-col items-center justify-center rounded-xl bg-slate-100 text-slate-400 border border-slate-200 text-xs gap-1"><i class="fa-regular fa-image text-xl"></i><span>ไม่สามารถแสดงภาพได้</span></div>`;
}

function logoHtml(sizeCls){
  if(DB.settings.logo) return `<img src="${formatImgUrl(DB.settings.logo)}" referrerpolicy="no-referrer" class="${sizeCls} object-contain rounded-xl bg-white" alt="logo" onerror="handleImgError(this)">`;
  return `<div class="${sizeCls} flex items-center justify-center rounded-xl" style="background:var(--c-soft);color:var(--c-primary)"><i class="fa-solid fa-graduation-cap"></i></div>`;
}

/* =========================================================
   2. AUTH
   ========================================================= */
function restoreSession(){
  try{ session = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); }catch(e){ session = null; }
  if(session){
    const u = DB.users.find(x => x.id === session.id);
    if(!u || u.role !== session.role){ session = null; localStorage.removeItem(LS_SESSION); }
  }
}
function openLogin(){
  let rem = null;
  try{ rem = JSON.parse(localStorage.getItem(LS_REMEMBER) || 'null'); }catch(e){}
  showModal({
    title:'<i class="fa-solid fa-right-to-bracket text-primary mr-1"></i> เข้าสู่ระบบ',
    size:'sm',
    saveText:'เข้าสู่ระบบ',
    body:`
      <div class="space-y-3">
        <div><label class="lbl">ชื่อผู้ใช้</label><input id="lg_u" class="inp" placeholder="username" value="${rem?esc(rem.u):''}"></div>
        <div><label class="lbl">รหัสผ่าน</label><input id="lg_p" type="password" class="inp" placeholder="password" value="${rem?esc(rem.p):''}"></div>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
          <input id="lg_rem" type="checkbox" class="w-4 h-4 accent-[color:var(--c-primary)]" ${rem?'checked':''}> จดจำชื่อผู้ใช้และรหัสผ่าน
        </label>
        <p class="text-[11px] text-slate-400 pt-1 border-t border-slate-100">ผู้ใช้ทั่วไปสามารถดูแดชบอร์ดและค้นหารายชื่อได้โดยไม่ต้องเข้าสู่ระบบ</p>
      </div>`,
    onSave: doLogin
  });
  setTimeout(()=>{ const el=$('#lg_u'); if(el && !el.value) el.focus(); else $('#lg_p')?.focus(); }, 120);
}
function doLogin(){
  const u = $('#lg_u').value.trim(), p = $('#lg_p').value;
  const user = DB.users.find(x => x.username === u && x.password === p);
  if(!user){
    Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',...alertCfg()});
    return;
  }
  session = {id:user.id, username:user.username, fullname:user.fullname, role:user.role};
  localStorage.setItem(LS_SESSION, JSON.stringify(session));
  if($('#lg_rem').checked) localStorage.setItem(LS_REMEMBER, JSON.stringify({u,p}));
  else localStorage.removeItem(LS_REMEMBER);
  closeModal();
  refreshChrome();
  toast('ยินดีต้อนรับ ' + user.fullname);
  go(user.role === 'admin' ? 'dashboard' : 'records');
}
function logout(){
  Swal.fire({
    title:'ออกจากระบบ?', text:'คุณต้องการออกจากระบบใช่หรือไม่', icon:'question',
    showCancelButton:true, confirmButtonText:'ออกจากระบบ', cancelButtonText:'ยกเลิก',
    confirmButtonColor:'#ef4444', cancelButtonColor:'#94a3b8', reverseButtons:true
  }).then(r=>{
    if(r.isConfirmed){
      session = null; localStorage.removeItem(LS_SESSION);

function statusBadge(st){
  const map = {
    pending:{t:'ยังไม่แก้ไข', c:'bg-red-100 text-red-700 border-red-200', i:'fa-circle-exclamation'},
    review:{t:'รอตรวจ', c:'bg-amber-100 text-amber-700 border-amber-200', i:'fa-clock'},
    passed:{t:'ผ่านแล้ว', c:'bg-emerald-100 text-emerald-700 border-emerald-200', i:'fa-circle-check'}
  };
  const m = map[st] || map.pending;
  return `<span class="chip border ${m.c}"><i class="fa-solid ${m.i}"></i>${m.t}</span>`;

function typeBadge(t){
  const map = {'0':'bg-red-100 text-red-600','ร':'bg-amber-100 text-amber-600','มส':'bg-blue-100 text-blue-600'};
  return `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg font-bold text-[12px] ${map[t]||'bg-slate-100 text-slate-500'}">${t}</span>`;
}
function statsFor(recs){
  const s0 = new Set(), sr = new Set(), sms = new Set(), all = new Set();
  recs.forEach(r=>{
    all.add(r.studentName);
    const types = Array.isArray(r.types) ? r.types : [];
    if(types.includes('0')) s0.add(r.studentName);
    if(types.includes('ร')) sr.add(r.studentName);
    if(types.includes('มส')) sms.add(r.studentName);
  });
  return {total:all.size, c0:s0.size, cr:sr.size, cms:sms.size};
}

/* Pagination Control Generator */
function paginationControls(currentPage, totalPages, totalItems, onPageFnName, itemUnit = 'รายการ'){
  if(totalPages <= 1 && totalItems <= 10) return '';
  let pages = [];
  if(totalPages <= 7){
    for(let i=1; i<=totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if(currentPage > 3) pages.push('...');
    const start = Math.max(2, currentPage - 1);
    const end = Math.min(totalPages - 1, currentPage + 1);
    for(let i=start; i<=end; i++) pages.push(i);
    if(currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }

  return `
    <div class="px-4 py-3 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-50/70">
      <p class="text-[12px] text-slate-500">
        หน้าที่ <span class="font-bold text-slate-700">${currentPage}</span> / <span class="font-bold text-slate-700">${totalPages}</span> 
        (ทั้งหมด <span class="font-bold text-slate-700">${totalItems}</span> ${itemUnit})
      </p>
      <div class="flex items-center gap-1">
        <button onclick="${onPageFnName}(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} 
          class="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-100 flex items-center justify-center text-xs transition shadow-sm" title="หน้าก่อนหน้า">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        ${pages.map(p => {
          if(p === '...') return '<span class="px-1 text-slate-400 text-xs">...</span>';
          return `<button onclick="${onPageFnName}(${p})" 
            class="w-8 h-8 rounded-lg text-xs font-semibold transition ${p === currentPage ? 'btn-primary shadow-sm' : 'border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 shadow-sm'}">
            ${p}
          </button>`;
        }).join('')}
        <button onclick="${onPageFnName}(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} 
          class="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-100 flex items-center justify-center text-xs transition shadow-sm" title="หน้าถัดไป">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>`;
}

function drawLevelChart(recs){
  const cv = document.getElementById('lvlChart');

   8.1 TEACHER RANKING LOGIC (ผู้ดูแลระบบ: อันดับครูผู้สอน)
   ========================================================= */
let dashRankingPage = 1;
window.dashRankingGo = function(p){
  dashRankingPage = p;
  const el = $('#dashTeacherRanking');
  if(el) el.innerHTML = renderTeacherRankingTable(dashSemId, dashRankingPage, 'dashRankingGo');

function getTeacherRankingData(semesterId){
  const recs = semesterId ? DB.records.filter(r => r.semesterId === semesterId) : [...DB.records];
  const groupMap = {}; // key: teacherName + '||' + subjectId

  recs.forEach(r => {
    const sub = subjectOf(r.subjectId);
    const teacherObj = DB.users.find(u => u.id === sub?.teacherId);
    const tName = teacherObj?.fullname || sub?.teacherName || (r.createdBy && r.createdBy !== '-' ? r.createdBy : 'ไม่ระบุครูผู้สอน');
    const sId = r.subjectId || 'unknown';
    const key = tName + '||' + sId;

    if(!groupMap[key]){
      groupMap[key] = {
        teacherName: tName,
        teacherPosition: teacherObj?.position || '',
        subjectCode: sub?.code || '-',
        subjectName: sub?.name || 'ไม่ระบุรายวิชา',
        level: sub?.level || r.level || '-',
        students: new Set(),
        recordsCount: 0,
        c0: 0,
        cr: 0,
        cms: 0
      };
    }
    const g = groupMap[key];
    g.recordsCount++;
    g.students.add(r.studentName);
    const types = Array.isArray(r.types) ? r.types : [];
    if(types.includes('0')) g.c0++;
    if(types.includes('ร')) g.cr++;
    if(types.includes('มส')) g.cms++;
  });

  const list = Object.values(groupMap).map(item => ({
    ...item,
    studentCount: item.students.size
  }));

  // เรียงลำดับจากมากที่สุดลงมา (มากสุดอยู่บนสุด)
  list.sort((a,b) => b.studentCount - a.studentCount || b.recordsCount - a.recordsCount);
  return list;
}

  }

  const perPage = 10;
  const totalPages = Math.max(1, Math.ceil(list.length / perPage));
  if(page > totalPages) page = totalPages;
  const slice = list.slice((page-1)*perPage, page*perPage);

  return `

            <th class="px-4 py-3 text-center font-bold text-red-600">จำนวนนักเรียนที่ติด</th>
            <th class="px-4 py-3 text-center font-bold">สรุปผลการเรียน</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${slice.map((item, idx) => {
            const rank = (page - 1) * perPage + idx + 1;
            let rankBadge = `<span class="font-bold text-slate-500">${rank}</span>`;
            if(rank === 1) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-400 text-white font-bold text-xs shadow-sm" title="อันดับ 1"><i class="fa-solid fa-crown text-[11px]"></i></span>`;
            else if(rank === 2) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-300 text-slate-700 font-bold text-xs shadow-sm" title="อันดับ 2">2</span>`;
            else if(rank === 3) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-600 text-white font-bold text-xs shadow-sm" title="อันดับ 3">3</span>`;

            return `<tr class="hover:bg-slate-50/80 transition">
              <td class="px-4 py-3 text-center whitespace-nowrap">${rankBadge}</td>
              <td class="px-4 py-3">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center justify-center text-xs font-bold shrink-0">

                  </div>
                </div>

                  <i class="fa-solid fa-user-xmark text-xs"></i>
                  <span>${item.studentCount}</span> คน
                </span>
              </td>
              <td class="px-4 py-3 text-center">

                  <span class="chip bg-red-100 text-red-600">0: ${item.c0}</span>

                </div>

}

function resetSearch(){
  Object.assign(searchState, {sem:'', subject:'', level:'', name:'', status:''});
  $('#s_sem').value=''; $('#s_subj').value=''; $('#s_level').value='';
  $('#s_name').value=''; $('#s_status').value='';
  searchPage = 1;
  applySearch();
}

function filterRecords(){
  let recs = [...DB.records];
  if(session?.role === 'teacher'){ const ids = mySubjectIds(); recs = recs.filter(r => ids.includes(r.subjectId)); }
  if(searchState.sem) recs = recs.filter(r => r.semesterId === searchState.sem);
  if(searchState.subject) recs = recs.filter(r => r.subjectId === searchState.subject);
  if(searchState.level) recs = recs.filter(r => r.level === searchState.level);
  if(searchState.status) recs = recs.filter(r => r.status === searchState.status);
  if(searchState.name){
    const q = searchState.name.trim().toLowerCase();
    recs = recs.filter(r => r.studentName.toLowerCase().includes(q));
  }
  // เรียงลำดับล่าสุดอยู่หน้าแรกบนสุด
  recs.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  return recs;
}

function applySearch(){
  const all = filterRecords();
  const st = statsFor(all);
  const perPage = 10;
  const totalPages = Math.max(1, Math.ceil(all.length / perPage));
  if(searchPage > totalPages) searchPage = totalPages;
  const shown = all.slice((searchPage - 1) * perPage, searchPage * perPage);

  $('#searchSummary').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${statCard('fa-users', 'นักเรียนที่ติดทั้งหมด', st.total, '#0ea5e9')}
      ${statCard('fa-circle-exclamation', 'ติด 0', st.c0, '#ef4444')}
      ${statCard('fa-clock', 'ติด ร', st.cr, '#f59e0b')}
      ${statCard('fa-ban', 'ติด มส', st.cms, '#3b82f6')}
    </div>`;

  $('#searchResults').innerHTML = `
    <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-table-list text-primary"></i>
        <span class="font-bold text-slate-700 text-sm">ผลการค้นหา</span>
        <span class="chip bg-slate-100 text-slate-500">พบ ${all.length} รายการ</span>
      </div>
      <span class="chip" style="background:var(--c-soft);color:var(--c-primary)">แสดงทีละ 10 รายการ</span>
    </div>
    ${recordsTable(shown, false)}
    ${paginationControls(searchPage, totalPages, all.length, 'searchPageGo')}`;
}

window.searchPageGo = function(p){
  searchPage = p;
  applySearch();
  window.scrollTo({top: 350, behavior:'smooth'});
};

  const wrap = $('#studentRows');

function openRecordModal(id){
  const rec = id ? DB.records.find(r => r.id === id) : null;
  const isEdit = !!rec;
  const isTeacher = session?.role === 'teacher';
  let subs = isTeacher ? DB.subjects.filter(s => mySubjectIds().includes(s.id)) : DB.subjects;

  if(!subs.length){
    Swal.fire({icon:'info', title:'ยังไม่มีรายวิชา',
      text: isTeacher ? 'คุณยังไม่ได้รับมอบหมายรายวิชา กรุณาติดต่อผู้ดูแลระบบ' : 'กรุณาเพิ่มรหัสวิชาและรายวิชาที่เมนู "ข้อมูลพื้นฐาน" ก่อน',
      ...alertCfg()});
    return;
  }
  if(!DB.semesters.length){
    Swal.fire({icon:'info', title:'ยังไม่มีภาคเรียน', text:'กรุณาเพิ่มภาคเรียนที่/ปีการศึกษา ก่อน', ...alertCfg()});
    return;
  }

  const defSem = rec?.semesterId || DB.settings.currentSemesterId || DB.semesters[0].id;
  const defSub = rec?.subjectId || subs[0].id;
  const defLvl = rec?.level || DB.levels[0] || '';

  const body = `
    <div class="grid md:grid-cols-2 gap-3">
      <div>
        <label class="lbl">ภาคเรียนที่ / ปีการศึกษา <span class="text-red-500 font-bold">*</span></label>
        <select id="f_sem" class="inp">${DB.semesters.map(s=>`<option value="${s.id}" ${s.id===defSem?'selected':''}>${semLabel(s)}</option>`).join('')}</select>
      </div>
      <div>
        <label class="lbl">ระดับชั้น <span class="text-red-500 font-bold">*</span></label>
        <select id="f_level" class="inp">${DB.levels.map(l=>`<option ${l===defLvl?'selected':''}>${esc(l)}</option>`).join('')}</select>
      </div>
      <div class="md:col-span-2">
        <label class="lbl">รหัสวิชาและรายวิชา <span class="text-red-500 font-bold">*</span></label>
        <select id="f_subj" class="inp">${subs.map(s=>`<option value="${s.id}" ${s.id===defSub?'selected':''}>${esc(s.code)} ${esc(s.name)}</option>`).join('')}</select>
      </div>
    </div>

    <!-- รายชื่อนักเรียน (จำเป็น * เพิ่มอย่างน้อย 1 ชื่อ) -->
    <div class="mt-5">
      <div class="flex items-center justify-between mb-2">
        <p class="font-bold text-slate-700 text-sm">
          <i class="fa-solid fa-user-graduate text-primary mr-1"></i> รายชื่อนักเรียนที่ติดผลการเรียน <span class="text-red-500 font-bold">* (อย่างน้อย 1 คน)</span>
        </p>
        ${isEdit ? '' : `<button type="button" onclick="addStudentRow()" class="px-3 py-1.5 rounded-lg text-[12px] font-semibold border border-slate-200 hover:bg-slate-50 text-slate-600"><i class="fa-solid fa-plus mr-1"></i>เพิ่มนักเรียน</button>`}
      </div>
      <div id="studentRows" class="space-y-2 max-h-64 overflow-y-auto pr-1">
        ${isEdit ? studentRowHtml(rec.studentName, rec.types)
                 : studentRowHtml() + studentRowHtml() + studentRowHtml()}
      </div>
      <p class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-circle-info mr-1"></i>ติ๊กช่อง 0 / ร / มส ให้นักเรียนแต่ละคน (ติ๊กได้มากกว่า 1 ช่อง)</p>
    </div>

    <div class="grid md:grid-cols-2 gap-3 mt-5">
      <div class="md:col-span-2">
        <label class="lbl">สาเหตุ <span class="text-red-500 font-bold">* (จำเป็น)</span></label>
        <textarea id="f_cause" rows="2" class="inp" placeholder="เช่น ไม่ส่งงานภาระงานสำคัญ, ขาดเรียนเกินเกณฑ์, ไม่เข้าสอบปลายภาค">${esc(rec?.cause || '')}</textarea>
      </div>
      <div class="md:col-span-2">
        <label class="lbl">แนวทางแก้ไข <span class="text-red-500 font-bold">* (จำเป็น)</span></label>
        <textarea id="f_sol" rows="2" class="inp" placeholder="เช่น ส่งใบงานชิ้นที่ 1-3 และทำแบบทดสอบแก้ตัว">${esc(rec?.solution || '')}</textarea>
      </div>
      <div>
        <label class="lbl">กำหนดส่งงานแก้ตัว <span class="text-red-500 font-bold">* (จำเป็น)</span></label>
        <input id="f_due" type="date" class="inp" value="${rec?.dueDate || ''}">

      <div>
        <label class="lbl">สถานะ <span class="text-red-500 font-bold">*</span></label>
        <select id="f_status" class="inp">
          <option value="pending" ${(!rec || rec.status==='pending')?'selected':''}>ยังไม่แก้ไข (แดง)</option>

        name: $('.sname', r).value.trim(),
        types: $$('.stype', r).filter(c => c.checked).map(c => c.value)

      const cause = $('#f_cause').value.trim();
      const solution = $('#f_sol').value.trim();

        Swal.fire({icon:'warning', title:'ข้อมูลไม่ครบถ้วน', text:'กรุณาระบุ "สาเหตุ" ที่นักเรียนติดผลการเรียน', ...alertCfg()});

      if(!solution){

        $('#f_due').focus();
        return;
      }

      const payload = {
        semesterId: $('#f_sem').value,
        level: $('#f_level').value,
        subjectId: $('#f_subj').value,
        cause: cause,
        solution: solution,
        dueDate: dueDate,
        status: $('#f_status').value
      };

      showLoader('กำลังบันทึกข้อมูลลง Google Sheet...');
      try {
        if(isEdit){
          Object.assign(rec, payload, {studentName: rows[0].name, types: rows[0].types});
        }else{
          rows.forEach(r => DB.records.push({
            id: uid(), ...payload,
            studentName: r.name, types: r.types,
            createdAt: Date.now(), createdBy: session?.fullname || '-'
          }));
        }
        await saveDB(true);
        hideLoader(); closeModal();
        toast(isEdit ? 'แก้ไขรายการสำเร็จ' : `เพิ่มรายการสำเร็จ ${rows.length} รายการ`);
        refresh();
      } catch(e) {
        hideLoader();
        Swal.fire({icon:'error', title:'เกิดข้อผิดพลาดในการบันทึก', text:e.message, ...alertCfg()});
      }
    }
  });
}

function deleteRecord(id){
  const rec = DB.records.find(r => r.id === id);
  if(!rec) return;
  Swal.fire({
    title:'ยืนยันการลบ?',
    html:`ต้องการลบรายการของ <b>${esc(rec.studentName)}</b><br><span class="text-sm text-slate-500">${semLabelOf(rec.semesterId)} • ${esc(subjectOf(rec.subjectId)?.name || '-')}</span>`,
    icon:'warning', showCancelButton:true,
    confirmButtonText:'ลบรายการ', cancelButtonText:'ยกเลิก',
    confirmButtonColor:'#ef4444', cancelButtonColor:'#94a3b8', reverseButtons:true
  }).then(async r=>{
    if(r.isConfirmed){
      showLoader('กำลังลบข้อมูล...');

    size:'md', body, saveText:'บันทึก',
    onSave: async () => {
      const username = $('#u_user').value.trim();
      const password = $('#u_pass').value;
      const fullname = $('#u_name').value.trim();
      const role = $('#u_role').value;
      const position = role === 'teacher' ? $('#u_pos').value.trim() : '';

      if(!username || !password || !fullname){
        Swal.fire({icon:'warning', title:'ข้อมูลไม่ครบถ้วน', text:'กรุณากรอกชื่อผู้ใช้ รหัสผ่าน และชื่อ-นามสกุล', ...alertCfg()});
        return;
      }
      const dup = DB.users.find(x => x.username === username && x.id !== id);
      if(dup){
        Swal.fire({icon:'error', title:'ชื่อผู้ใช้ซ้ำ', text:'มีชื่อผู้ใช้นี้ในระบบแล้ว', ...alertCfg()});
        return;
      }
      showLoader('กำลังบันทึกข้อมูล...');
      try {
        if(isEdit){ Object.assign(u, {username, password, fullname, role, position}); }
        else{ DB.users.push({id:uid(), username, password, fullname, role, position}); }
        await saveDB(true);
        hideLoader(); closeModal();

        refresh();
      } catch(e) {
        hideLoader();
        Swal.fire({icon:'error', title:'เกิดข้อผิดพลาด', text:e.message, ...alertCfg()});
      }
    }
  });
  togglePositionField();
}
function togglePositionField(){
  const role = $('#u_role')?.value;
  const w = $('#posWrap');

function deleteUser(id){
  const u = DB.users.find(x => x.id === id);
  if(!u) return;
  if(u.id === session.id){
    Swal.fire({icon:'error', title:'ไม่สามารถลบได้', text:'คุณไม่สามารถลบบัญชีของตนเองได้', ...alertCfg()});

  }
  Swal.fire({
    title:'ยืนยันการลบ?',
    html:`ต้องการลบผู้ใช้งาน <b>${esc(u.fullname)}</b> (${esc(u.username)})`,

    confirmButtonText:'ลบผู้ใช้งาน', cancelButtonText:'ยกเลิก',

  }).then(async r=>{
    if(r.isConfirmed){

      await saveDB(true);

  });

function openSemModal(id){
  const s = id ? DB.semesters.find(x => x.id === id) : null;
  const body = `
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="lbl">ภาคเรียนที่ <span class="text-red-500">*</span></label>
        <select id="sm_term" class="inp">
          ${['1','2','3'].map(t=>`<option ${s?.term===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">ปีการศึกษา (พ.ศ.) <span class="text-red-500">*</span></label>
        <input id="sm_year" class="inp" placeholder="เช่น 2568" value="${esc(s?.year || (new Date().getFullYear()+543))}">
      </div>
    </div>`;
  showModal({
    title: s ? 'แก้ไขภาคเรียน' : 'เพิ่มภาคเรียนที่ / ปีการศึกษา',
    size:'sm', body, saveText:'บันทึก',
    onSave: async () => {
      const term = $('#sm_term').value, year = $('#sm_year').value.trim();
      if(!year){ Swal.fire({icon:'warning', title:'กรอกปีการศึกษา', ...alertCfg()}); return; }
      showLoader('กำลังบันทึกภาคเรียน...');
      if(s) Object.assign(s, {term, year});
      else{
        const ns = {id:uid(), term, year};
        DB.semesters.push(ns);
        if(!DB.settings.currentSemesterId) DB.settings.currentSemesterId = ns.id;
      }
      await saveDB(true);
      hideLoader(); closeModal(); toast('บันทึกภาคเรียนสำเร็จ'); refresh();
    }
  });
}
function deleteSem(id){
  const used = DB.records.filter(r => r.semesterId === id).length;
  Swal.fire({
    title:'ยืนยันการลบ?',
    html: used ? `มีรายการติด 0 ร มส <b>${used}</b> รายการที่ใช้ภาคเรียนนี้<br>จะถูกลบไปด้วย` : 'ต้องการลบภาคเรียนนี้ใช่หรือไม่',
    icon:'warning', showCancelButton:true, confirmButtonText:'ลบ', cancelButtonText:'ยกเลิก',
    confirmButtonColor:'#ef4444', cancelButtonColor:'#94a3b8', reverseButtons:true
  }).then(async r=>{
    if(r.isConfirmed){
      showLoader('กำลังลบภาคเรียน...');
      DB.semesters = DB.semesters.filter(x => x.id !== id);
      DB.records = DB.records.filter(x => x.semesterId !== id);
      if(DB.settings.currentSemesterId === id) DB.settings.currentSemesterId = DB.semesters[0]?.id || '';
      await saveDB(true);
      hideLoader(); toast('ลบภาคเรียนสำเร็จ'); refresh();
    }
  });
}

        </div>
      </div>
    </div>`;

    title: n ? '<i class="fa-solid fa-pen text-primary mr-1"></i> แก้ไขข่าว' : '<i class="fa-solid fa-plus text-primary mr-1"></i> เพิ่มข่าวประชาสัมพันธ์',
    size:'lg', body, saveText:'บันทึกข่าว',
    onSave: () => {
      const title = $('#n_title').value.trim();
      if(!title){ Swal.fire({icon:'warning', title:'กรอกหัวเรื่องข่าว', ...alertCfg()}); return; }
      const content = $('#n_content').value.trim();
      const imgInput = $('#n_img'), fileInput = $('#n_file');

      showLoader('กำลังอัปโหลดไฟล์ไปยัง Google Drive...');
      readFiles(imgInput, async newImgs => {
        readFiles(fileInput, async newFiles => {
          try {
            const uploadedImgs = [];
            for(const im of newImgs){
              const url = await uploadFileToDrive(im.data, im.name, im.type);
              uploadedImgs.push(url);
            }

            const uploadedFiles = [];
            for(const fl of newFiles){
              const url = await uploadFileToDrive(fl.data, fl.name, fl.type);
              uploadedFiles.push({ name: fl.name, url: url });
            }

            const imgs = tmpNewsImages.concat(uploadedImgs);
            const files = tmpNewsFiles.concat(uploadedFiles);

            if(n) Object.assign(n, {title, content, images:imgs, files, updatedAt:Date.now()});
            else DB.news.push({id:uid(), title, content, images:imgs, files, createdAt:Date.now(), author:session.fullname});

            await saveDB(true);
            hideLoader(); closeModal(); toast(n ? 'แก้ไขข่าวสำเร็จ' : 'เพิ่มข่าวสำเร็จ'); refresh();
          } catch(e) {
            hideLoader();
            Swal.fire({icon:'error', title:'อัปโหลดไม่สำเร็จ', text:e.message, ...alertCfg()});
          }
        });
      });
    }
  });

  const renderPrev = () => {
    $('#n_img_preview').innerHTML = tmpNewsImages.map((im,i)=>`
      <div class="relative">
        <img src="${im}" class="w-16 h-16 object-cover rounded-lg border border-slate-200">

      </div>`).join('');
    $('#n_file_preview').innerHTML = tmpNewsFiles.map((f,i)=>`
      <span class="chip bg-slate-100 text-slate-600">${esc(f.name)}
        <button type="button" onclick="rmTmpFile(${i})" class="text-red-500 ml-1"><i class="fa-solid fa-xmark"></i></button>
      </span>`).join('');
  };
  window.rmTmpImg = i => { tmpNewsImages.splice(i,1); renderPrev(); };
  window.rmTmpFile = i => { tmpNewsFiles.splice(i,1); renderPrev(); };
  renderPrev();
}

  DB.settings.currentSemesterId = v; 
  await saveDB(true); toast('ตั้งภาคเรียนปัจจุบันสำเร็จ');
}
function resetAll(){
  Swal.fire({
    title:'รีเซ็ตระบบทั้งหมด?',
    html:'ข้อมูลในเครื่องจะถูกลบทั้งหมด<br><span class="text-red-500 font-semibold">ไม่สามารถกู้คืนได้</span>',
    icon:'error', showCancelButton:true, confirmButtonText:'ยืนยันรีเซ็ต', cancelButtonText:'ยกเลิก',
    confirmButtonColor:'#ef4444', cancelButtonColor:'#94a3b8', reverseButtons:true
  }).then(r=>{
    if(r.isConfirmed){
      showLoader('กำลังรีเซ็ต...');
      setTimeout(()=>{
        localStorage.removeItem(LS_DB);
        localStorage.removeItem(LS_SESSION);
        loadDB(); applyTheme(); session = null;
        hideLoader(); refreshChrome(); go('home');
        toast('รีเซ็ตระบบเรียบร้อยแล้ว');
      }, 500);
    }
  });
}

function renderProfile(){
  $('#pageTitle').textContent = TITLES.profile;
  const u = DB.users.find(x => x.id === session.id);
  if(!u){ go('home'); return; }
  $('#content').innerHTML = `
    <div class="space-y-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">บัญชีของฉัน</h2>
        <p class="text-[13px] text-slate-500">ข้อมูลส่วนตัวและเปลี่ยนรหัสผ่าน</p>
      </div>

      <div class="grid lg:grid-cols-3 gap-4">
        <div class="card p-5 lg:col-span-1">
          <div class="flex flex-col items-center text-center">
            <div class="w-20 h-20 rounded-full btn-primary flex items-center justify-center text-white text-3xl font-bold mb-3">${esc(u.fullname.charAt(0))}</div>
            <p class="font-bold text-lg text-slate-800">${esc(u.fullname)}</p>
            <p class="text-[13px] text-slate-500">@${esc(u.username)}</p>
            <div class="mt-3">
              ${u.role === 'admin'
                ? '<span class="chip bg-purple-100 text-purple-700"><i class="fa-solid fa-user-shield"></i>ผู้ดูแลระบบ</span>'
                : '<span class="chip bg-sky-100 text-sky-700"><i class="fa-solid fa-chalkboard-user"></i>ครู</span>'}
            </div>
            ${u.position ? `<p class="text-[12px] text-slate-400 mt-2">${esc(u.position)}</p>` : ''}
          </div>
        </div>

        <div class="card p-5 lg:col-span-2">
          <h3 class="font-bold text-slate-800 mb-3"><i class="fa-solid fa-key text-primary mr-1"></i> เปลี่ยนรหัสผ่าน</h3>
          <div class="grid md:grid-cols-2 gap-3">
            <div class="md:col-span-2">
              <label class="lbl">รหัสผ่านปัจจุบัน <span class="text-red-500">*</span></label>
              <input id="pw_old" type="password" class="inp" placeholder="••••••••">
            </div>
            <div>
              <label class="lbl">รหัสผ่านใหม่ <span class="text-red-500">*</span></label>
              <input id="pw_new" type="password" class="inp" placeholder="••••••••">
            </div>
            <div>
              <label class="lbl">ยืนยันรหัสผ่านใหม่ <span class="text-red-500">*</span></label>
              <input id="pw_cf" type="password" class="inp" placeholder="••••••••">
            </div>
          </div>
          <button onclick="changePassword()" class="mt-4 px-5 py-2.5 rounded-xl btn-primary text-sm font-semibold"><i class="fa-solid fa-floppy-disk mr-1"></i>บันทึกรหัสผ่านใหม่</button>
        </div>
      </div>
    </div>`;
}
async function changePassword(){
  const u = DB.users.find(x => x.id === session.id);
  const o = $('#pw_old').value, n = $('#pw_new').value, c = $('#pw_cf').value;
  if(!o || !n || !c){ Swal.fire({icon:'warning', title:'ข้อมูลไม่ครบถ้วน', text:'กรุณากรอกรหัสผ่านให้ครบทุกช่อง', ...alertCfg()}); return; }
  if(o !== u.password){ Swal.fire({icon:'error', title:'รหัสผ่านปัจจุบันไม่ถูกต้อง', ...alertCfg()}); return; }
  if(n.length < 6){ Swal.fire({icon:'warning', title:'รหัสผ่านสั้นเกินไป', text:'รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร', ...alertCfg()}); return; }
  if(n !== c){ Swal.fire({icon:'error', title:'รหัสผ่านใหม่ไม่ตรงกัน', ...alertCfg()}); return; }
  showLoader('กำลังเปลี่ยนรหัสผ่าน...');
  u.password = n; 
  await saveDB(true); 
  hideLoader();
  $('#pw_old').value=''; $('#pw_new').value=''; $('#pw_cf').value='';
  const rem = JSON.parse(localStorage.getItem(LS_REMEMBER) || 'null');
  if(rem && rem.u === u.username) localStorage.setItem(LS_REMEMBER, JSON.stringify({u:u.username, p:n}));
  toast('เปลี่ยนรหัสผ่านสำเร็จ');
}

(async function init(){
  loadDB();
  applyTheme();
  restoreSession();
  refreshChrome();
  renderPage();

  window.addEventListener('resize', () => {
    if(window.innerWidth >= 1024){
      $('#sidebar').classList.remove('-translate-x-full');
      $('#overlay').classList.add('hidden');
    }else{
      $('#sidebar').classList.add('-translate-x-full');
    }
  });

  if(getGasUrl()){
    fetchFromGAS(false);
  }
})();
</script>
